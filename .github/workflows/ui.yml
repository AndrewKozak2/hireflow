name: UI CI/CD

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "ui/**"
      - ".github/workflows/ui.yml"

  push:
    branches: [develop, main]
    paths:
      - "ui/**"
      - ".github/workflows/ui.yml"

  workflow_dispatch:

env:
  DOCKER_REGISTRY: registry.intercode.win
  DOCKER_REGISTRY_PROJECT: hireflow
  DOCKER_REPOSITORY: hireflow-ui
  IMAGE_TAG: ${{ github.ref == 'refs/heads/main' && 'production' || 'stage' }}-${{ github.sha }}

jobs:
  lint-and-build-ui:
    name: UI
    runs-on: ubuntu-latest

    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'stage' }}

    defaults:
      run:
        working-directory: ui

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ./ui
        run: npm ci

      - name: Run linting for UI
        working-directory: ./ui
        run: npm run lint

      - name: Run tests for UI
        working-directory: ./ui
        run: npm run test

      - name: Run formatting for UI
        working-directory: ./ui
        run: npm run format

  deployment:
    runs-on: ubuntu-latest
    needs: lint-and-build-ui
    if: github.event_name != 'pull_request'

    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'stage' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.REGISTRY_CLI_USERNAME }}
          password: ${{ secrets.REGISTRY_CLI_KEY }}

      - name: Set up Docker Build
        uses: docker/setup-buildx-action@v3

      - name: Build and push UI image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/ui/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REGISTRY_PROJECT }}/${{ env.DOCKER_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REGISTRY_PROJECT }}/${{ env.DOCKER_REPOSITORY }}:${{ github.ref == 'refs/heads/main' && 'production' || 'stage' }}
          build-args: |
            NODE_ENV=${{ github.ref == 'refs/heads/main' && 'production' || 'stage' }}
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}
            VITE_SENTRY_ENV=${{ github.ref == 'refs/heads/main' && 'production' || 'stage' }}
        env:
          BUILDKIT_PROGRESS: plain
