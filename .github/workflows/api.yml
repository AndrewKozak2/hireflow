name: API CI/CD

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "api/**"
      - ".github/workflows/api.yml"

  push:
    branches: [develop, main]
    paths:
      - "api/**"
      - ".github/workflows/api.yml"

  workflow_dispatch:

env:
  DOCKER_REGISTRY: registry.intercode.win
  DOCKER_REGISTRY_PROJECT: hireflow
  DOCKER_REPOSITORY: hireflow-api
  IMAGE_TAG: ${{ github.ref == 'refs/heads/main' && 'production' || 'stage' }}-${{ github.sha }}

jobs:
  lint-and-build-api:
    name: API
    runs-on: ubuntu-latest

    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'stage' }}

    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        working-directory: ./api
        run: npm ci

      - name: Run linting for API
        working-directory: ./api
        run: npm run lint

      - name: Run tests for API
        working-directory: ./api
        run: npm run test

      - name: Run formatting for API
        working-directory: ./api
        run: npm run format

  deployment:
    runs-on: ubuntu-latest
    needs: lint-and-build-api
    if: github.event_name != 'pull_request'

    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'stage' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.REGISTRY_CLI_USERNAME }}
          password: ${{ secrets.REGISTRY_CLI_KEY }}

      - name: Set up Docker Build
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/api/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REGISTRY_PROJECT }}/${{ env.DOCKER_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REGISTRY_PROJECT }}/${{ env.DOCKER_REPOSITORY }}:${{ github.ref == 'refs/heads/main' && 'production' || 'stage' }}
          build-args: |
            NODE_ENV=${{ github.ref == 'refs/heads/main' && 'production' || 'stage' }}
            PORT=${{ vars.PORT }} 
            DB_HOST=${{ vars.DB_HOST }} 
            DB_PORT=${{ vars.DB_PORT }}
            DB_USER=${{ secrets.POSTGRES_USER }}
            DB_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            DB_NAME=${{ secrets.POSTGRES_DB }}
            CORS_ALLOWED_ORIGINS=${{ vars.CORS_ALLOWED_ORIGINS }}
            JWT_ACCESS_SECRET=${{ secrets.JWT_ACCESS_SECRET }}
            JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
            EMAIL_PROVIDER=${{ vars.EMAIL_PROVIDER }}
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            RESEND_FROM_EMAIL=${{ vars.RESEND_FROM_EMAIL }}
            BREVO_API_KEY=${{ secrets.BREVO_API_KEY }}
            EMAIL_FROM=${{ vars.EMAIL_FROM }}
            CLIENT_URL=${{ vars.CLIENT_URL }}
        env:
          BUILDKIT_PROGRESS: plain
