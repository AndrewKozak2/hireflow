name: Deploy Apps Script

on:
  push:
    branches:
      - develop
    paths:
      - "apps-scripts/email-forwarder/**" # Runs only when changes are made to this folder
      - ".github/workflows/apps-scripts.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install
        working-directory: apps-scripts/email-forwarder

      - name: Create clasp auth file
        run: |
          echo '${{ secrets.CLASP_CREDENTIALS }}' > ~/.clasprc.json

      - name: Push to Apps Script
        run: npx clasp push -f
        working-directory: apps-scripts/email-forwarder
